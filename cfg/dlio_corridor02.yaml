dlio:

  version: 1.1.1

  adaptive: true

  pointcloud:
    deskew: true
    voxelize: true

  imu:
    calibration: true
    intrinsics:
      accel:
        bias: [ 0.0, 0.0, 0.0 ]
        sm:   [ 1.,  0.,  0.,
                0.,  1.,  0.,
                0.,  0.,  1. ]
      gyro:
        bias: [ 0.0, 0.0, 0.0 ]

  # SuperLoc corridor01 (Hawkins RC2, VLP-16 + Epson IMU), from the dataset's
  # corridor01_extrinsics.yaml. baselink is the IMU, so baselink2lidar is that
  # file's laser_to_imu and baselink2imu is identity.
  # SuperLoc corridor02. baselink is the IMU, so baselink2lidar is the dataset's
  # laser_to_imu and baselink2imu is identity.
  extrinsics:
    baselink2imu:
      t: [ 0., 0., 0. ]
      R: [ 1.,  0.,  0.,
           0.,  1.,  0.,
           0.,  0.,  1. ]
    baselink2lidar:
      t: [ 0.000000, 0.000000, 0.000000 ]
      R: [ 0.999954875,  0.000000000,  0.009499857,
           0.000000000,  1.000000000,  0.000000000,
           -0.009499857,  0.000000000,  0.999954875 ]

